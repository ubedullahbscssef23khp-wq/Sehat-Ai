[project]
name = "sehat-ai-backend"
version = "0.0.1"
description = "Sehat AI backend: AI-assisted healthcare guidance and symptom triage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
